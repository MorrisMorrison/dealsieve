<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dealsieve</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M4 8h8M6 12h4"/></svg>
        </span>
        dealsieve
      </div>
      <span id="status" class="status" role="status"></span>
      <span class="spacer"></span>
      <a href="/settings.html" class="icon-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light and dark theme" title="Toggle light and dark theme">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg>
      </button>
    </header>

    <div id="toolbar" class="toolbar">
      <div class="segmented" role="tablist" aria-label="Deal views">
        <button type="button" role="tab" id="tab-passed" data-view="passed" aria-controls="deals-panel" aria-selected="true">Passed <span class="count num" data-count="passed"></span></button>
        <button type="button" role="tab" id="tab-watchlist" data-view="watchlist" aria-controls="deals-panel" aria-selected="false" tabindex="-1">Watchlist <span class="count num" data-count="watchlist"></span></button>
        <button type="button" role="tab" id="tab-blocked" data-view="blocked" aria-controls="deals-panel" aria-selected="false" tabindex="-1">Blocked <span class="count num" data-count="blocked"></span></button>
      </div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m14 14-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search deals" aria-label="Search deals">
      </label>
      <select id="category" class="select" aria-label="Category"><option value="">All categories</option></select>
    </div>

    <div id="suggestion-banner" class="banner" hidden><span></span><a href="/settings.html#suggestions">Review →</a></div>

    <main id="deals-panel" class="split" role="tabpanel" aria-labelledby="tab-passed">
      <ul id="list" class="inbox" role="listbox" aria-label="Deals" tabindex="0"></ul>
      <aside id="detail" class="detail" aria-label="Deal details"></aside>
    </main>

  </div>

  <template id="item-template">
    <li class="item" role="option" aria-selected="false">
      <span class="thumb"></span>
      <span class="grow">
        <span class="title"></span>
        <span class="sub"><span class="price num"></span><span class="meta merchant"></span><span class="chip"></span></span>
      </span>
      <span class="side"><span class="temp num"></span><span class="when"></span></span>
    </li>
  </template>

  <template id="detail-template">
    <div class="detail-inner">
      <button type="button" class="back" data-back>← Back to deals</button>
      <h2 class="detail-title"></h2>
      <div class="detail-price"><span class="price num"></span> <span class="meta merchant"></span></div>
      <figure class="heat">
        <figcaption class="row-between meta"><span>Temperature</span><span class="temp num"></span></figcaption>
        <svg class="bigspark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><polygon/><polyline/></svg>
        <div class="row-between meta small"><span class="first-seen"></span><span class="heat-now">now</span></div>
      </figure>
      <section>
        <h3 class="label why-label"></h3>
        <ul class="why"></ul>
      </section>
      <dl class="kv">
        <dt>Category</dt><dd class="category"></dd>
        <dt>Seen in</dt><dd class="feeds"></dd>
      </dl>
      <div class="btnrow">
        <a class="btn primary" target="_blank" rel="noopener noreferrer">Open deal ↗</a>
        <button type="button" class="btn" data-kind="hide_deal">Hide</button>
        <button type="button" class="btn" data-kind="junk">Junk</button>
        <button type="button" class="btn" data-kind="mute_merchant">Mute shop</button>
        <button type="button" class="btn" data-kind="mute_category">Mute category</button>
      </div>
      <p class="hint meta small">↑ ↓ to move · Enter to open</p>
    </div>
  </template>
</body>
</html>
