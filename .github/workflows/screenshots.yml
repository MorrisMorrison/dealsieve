name: README screenshots

# Captures the page from a demo-data instance (see screenshots/). On main it
# force-pushes the PNGs to the dedicated `screenshots` branch (the README links
# to that branch's raw URLs), never to main. On PRs it only checks that the
# capture works. Runs only when something the page shows can have changed.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'internal/**'
      - 'cmd/**'
      - 'screenshots/**'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'internal/**'
      - 'cmd/**'
      - 'screenshots/**'
      - '.github/workflows/screenshots.yml'

# Cancel superseded runs on a PR; let main runs finish.
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots:
    name: Capture + publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install capture tooling
        working-directory: screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build
        run: CGO_ENABLED=0 go build -o dealsieve ./cmd/dealsieve
      - name: Capture screenshots
        working-directory: screenshots
        run: npm run capture
      - name: Publish to the screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.png
          git commit -q -m "screenshots @ ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
