# Coverage is reported, never enforced: PR statuses are informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  unit:
    carryforward: true

ignore:
  - "test/**"
  - "docs-site/**"
  - "screenshots/**"

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
